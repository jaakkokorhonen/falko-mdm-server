# GCP Cloud Build -pipeline: rakentaa Docker-imagen ja ajaa Terraform-julkaisun
# Triggeröityy automaattisesti kun muutokset yhdistetään main-haaraan

steps:
  # 1. Rakennetaan Docker-image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - 'europe-north1-docker.pkg.dev/$PROJECT_ID/falko/mdm-server:latest'
      - '.'

  # 2. Tallennetaan kuva Artifact Registryyn (Artifact Analysis skannaa tämän automaattisesti)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'europe-north1-docker.pkg.dev/$PROJECT_ID/falko/mdm-server:latest'

  # 3. Alustetaan Terraform
  - name: 'hashicorp/terraform:1.8.0'
    dir: 'terraform'
    args:
      - 'init'

  # 4. Ajetaan Terraform julkaisemaan kaikki pilviresurssit
  - name: 'hashicorp/terraform:1.8.0'
    dir: 'terraform'
    args:
      - 'apply'
      - '-auto-approve'
      - '-var=gcp_project_id=$PROJECT_ID'
      - '-var=gcp_region=europe-north1'
      - '-var=dns_project_id=froide'
      - '-var=dns_zone_name=falko-fi-zone'
      - '-var=apns_team_id=$_APNS_TEAM_ID'
      - '-var=apns_key_id=$_APNS_KEY_ID'
      - '-var=secret_key=$_SECRET_KEY'
      - '-var=container_image=europe-north1-docker.pkg.dev/$PROJECT_ID/falko/mdm-server:latest'

images:
  - 'europe-north1-docker.pkg.dev/$PROJECT_ID/falko/mdm-server:latest'

options:
  logging: CLOUD_LOGGING_ONLY
