name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  devsecops:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout koodi
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Salaisuuksien skannaus (Gitleaks)
      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      # 3. Python-ympäristön pystytys
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 4. Riippuvuuksien asennus
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit checkov

      # 5. Sovelluksen haavoittuvuuksien skannaus (Bandit SAST)
      - name: Run Bandit SAST Scan
        run: |
          bandit -r app/ main.py -v

      # 6. Riippuvuuksien haavoittuvuusskannaus (pip-audit SCA)
      - name: Run pip-audit SCA Scan
        run: |
          pip-audit --local

      # 7. Terraform-tiedostojen tietoturvaskannaus (Checkov IaC)
      - name: Run Checkov IaC Scan
        run: |
          checkov -d terraform/ --framework terraform

      # 8. Yksikkötestien suoritus (Pytest)
      - name: Run Pytest Unit Tests
        run: |
          PYTHONPATH=. pytest -v
