name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  devsecops:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout koodi
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Salaisuuksien skannaus (Gitleaks)
      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      # 3. Python-ympäristön pystytys
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 4. Riippuvuuksien asennus
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r agent/requirements.txt
          pip install bandit pip-audit checkov

      # 5. Sovelluksen haavoittuvuuksien skannaus (Bandit SAST)
      - name: Run Bandit SAST Scan
        run: |
          bandit -r app/ agent/ main.py -v

      # 6. Riippuvuuksien haavoittuvuusskannaus (pip-audit SCA)
      - name: Run pip-audit SCA Scan
        run: |
          pip-audit -r requirements.txt -r agent/requirements.txt

      # 7. Terraform-tiedostojen tietoturvaskannaus (Checkov IaC)
      - name: Run Checkov IaC Scan
        run: |
          checkov -d terraform/ --framework terraform

      # 8a. PR-ajo: vain smoke-testit (nopea signaali, <30s tavoite)
      #     Ajetaan jokaisessa pull requestissa ennen review-pyyntöä.
      #     Ref: pyproject.toml markers (smoke, regression, slow)
      - name: Smoke tests (PR)
        if: github.event_name == 'pull_request'
        run: |
          PYTHONPATH=. pytest -m smoke --tb=short -v

      # 8b. Main-ajo: regression-sarja + coverage-raportointi
      #     Ajetaan kun koodi mergeytyy main-haaraan.
      #     fail_under-raja on pyproject.toml:ssa (70 → nostetaan 80:een
      #     kun yksikkötestit #7, #8, #9 on kirjoitettu).
      - name: Regression tests + coverage (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          PYTHONPATH=. pytest -m "smoke or regression" \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      # 9. Julkaise coverage.xml artefaktina (saatavilla Actions-välilehdeltä)
      #    Käytetään myöhemmin mahdolliseen Codecov-integraatioon tai
      #    PR-kommentointiin (esim. pytest-coverage-comment action).
      - name: Upload coverage report
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30
